; Romania mod: a 25th nation. This file in the game folder turns the mod on in winmm.dll,
; together with the mod's rules.xml (25 nations) in mod_override\Data\. Every player of a
; multiplayer game needs the same files and values.

[power]
; The Power of the Carpathians is made of pieces of other nations' powers, each run by the
; game's own code. 1 = Romania has it, 0 = not. The help text (help.xml TRIBE24) lists all
; four whatever is set here.
; Russian: attrition to enemy units in Romanian territory doubled; the attrition research
; (Allegiance, Oath of Fealty, Patriotism, Nationalism) free.
attrition=1
; Russian: +20% Oil gathering.
oil=1
; Roman: Forts and Towers 25% cheaper; Forts 50% faster to build, +3 borders, Fort research free.
forts=1
; Korean: the Militia, Minuteman and Partisan upgrades free.
partisans=1
