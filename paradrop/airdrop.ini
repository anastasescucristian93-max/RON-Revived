; Airdrop (paradrop mod). This file must be in the game folder, next to winmm.dll: it turns the
; Airbase's Airdrop ability on. In multiplayer every player needs the same values.

[airdrop]
; price of one drop
cost_food=400
cost_oil=350
; part of the price that comes back when the helicopter lands at its Airbase again
refund_percent=33
; seconds before the same Airbase can send another helicopter
cooldown_seconds=45
; Paratrooper squads per drop (at most 6); each squad is one unit of 3 soldiers
squad=2

[ai]
; computer players use Airdrop: only on an enemy city bombed down to under half
; (city_damage_percent or more lost), with few soldiers around, within reach of an Airbase,
; with plenty of food and oil to spare, one helicopter in the air at a time
enabled=1
food_reserve=1500
oil_reserve=1000
city_damage_percent=45
max_defenders=4
range_tiles=80
