; RON Revived settings. Changes apply the next time you start the game (the [assistant]
; section applies while you play).
; 1 = on, 0 = off. Times are in milliseconds (lower = snappier).

[camera]
; Smooth scrolling: normalized diagonals, acceleration and braking.
smooth_scroll=1
; How fast the camera reaches full speed / comes to a stop. 0 = instant, like the game.
scroll_accel_ms=0
scroll_decel_ms=0
; Multiplier on top of the in-game scroll speed (1.0 = same as the game).
scroll_speed=1.0
; Vertical speed relative to horizontal (1.0 = equal on the map).
vertical_speed=1.0

; Smooth zoom between levels. zoom_smooth_ms = how long a zoom step takes (higher = slower).
smooth_zoom=1
zoom_smooth_ms=250
; 1 = zoom in toward the cursor (the point under the mouse stays put)
; 0 = like the game: the camera centers on the cursor (but smoothly)
; 2 = zoom on the screen centre, the camera does not move
zoom_to_cursor=1
; Camera jumps (pan_to) become smooth.
pan_smooth_ms=70
; 1 = the camera tilt changes gradually during a zoom; 0 = it jumps to the new level at once.
zoom_tilt=1
; 1 = sprites use linear texture filtering while zooming (no pixel shimmer), point at rest.
zoom_linear_filter=1
; 1 = one zoom step farther out than the game allows (the farther view replays use) and,
; with smooth_zoom, one step closer in (buildings are then drawn enlarged, a little soft).
extra_zoom=1
; 1 = buildings are placed on the screen with sub-pixel precision. The game rounds their
; position to whole pixels, so during a smooth zoom or scroll they jump from pixel to pixel
; against the terrain (the "vibration"). The linear filter above is then also used while
; scrolling. 0 = the game's whole-pixel placement.
subpixel_sprites=1

; Fixes the camera getting stuck moving in one direction after alt-tab.
fix_stuck_keys=1

; Writes ron_camera.log to the game folder.
log=1

[ui]
; Interface size on high-resolution screens. The whole game view is enlarged (like a lower
; resolution would), but it is still drawn at your screen's full resolution.
; auto = follow the Windows display scale (Settings > Display > Scale, e.g. 150%)
; 1 = off (the game's original tiny interface); 1.25, 1.5, 2 = fixed size.
ui_scale=auto
; Resource panel (top left) and the population and city counters: numbers this much larger
; (1.25 = 25%; the interface theme makes the panel larger by the same amount). 1 = off.
; With an enlarged interface (ui_scale) the size is rounded so the digits stay sharp.
hud_scale=1.25
; Income rates in the resource panel ("/+40") in green instead of grey.
green_rates=1
; 1 = the resource panel without its workers column: under each resource a bar with a segment
; per place of work (farms, woodcutters, mines, oil wells, merchants, scholars), lit for the ones
; in use, and "used/places" at the row's end; the handle under the rows shows / hides the bars.
; The market opens to the right of the resources. 0 = the game's panel.
resource_bars=1
; The big announcements (age reached, city under attack, wonders, captures...) at the top
; centre of the screen instead of its middle: the top of their picture this many pixels from the
; top (55 lower while the mini library is open). 0 = in the middle, as in the game.
notices_top=75
; 1 = when their time is up they leave to the right along the top, instead of flying across the
; map to the bottom-right corner.
notices_leave_top=1
; The Survival game mode (Script: Survival in the game setup): the clocks at the top right, time
; left to survive and to the next wave, this many pixels from the top. 0 = under the game's own
; clock lines.
survival_clock_y=0
; 1 = while the bottom interface is folded (its arrow button), the minimap sits in the top right
; corner, and a round button in the very corner (beside the map) makes it small, medium (+20%) or large
; (+44%). The game's clocks (Armageddon, wonders, time limit) and the wonders being built line up
; a little under it, whatever its size. 0 = at the bottom right, as in the game.
minimap_top_right=1
; The minimap's size there: 0 small, 1 medium, 2 large (the button writes it here).
minimap_size=0
; 1 = with the bottom interface folded, selecting something still shows the full selection panel
; next to the command buttons (name, hit points, attack, armor, range, queue); several objects
; show a grid six cells wide, one picture per kind with its count, the kills large in the top row.
; 0 = the game's one-line strip.
folded_selection_panel=1
; Space between the command buttons and that panel (interface units).
folded_panel_gap=12
; 1 = ten languages in Options > Player > Language: the game's five (English, German, Spanish,
; French, Italian) and Russian, Portuguese (Brazil), Polish, Turkish, Romanian. Texts not yet
; translated show in English. 0 = only the game's five.
more_languages=1
; 1 = a round flag button under Workshop in the launcher: click it, pick a flag, and the game
; and the launcher's buttons are in that language. 0 = no button (Options > Player > Language).
language_button=1

[launcher]
; Sounds in the launcher: a short tick when the mouse comes onto a button, the game's menu
; button sound when you press it. Wav files from the game folder; empty = no sound.
hover_sound=sounds\tabs.wav
click_sound=sounds\buttonsoundtopbuttons.wav
; Their volume in percent (0 = off).
sound_volume=70

[update]
; When the launcher opens, look on GitHub for a newer version of RON Revived and offer it
; there (an Update button over the picture; it downloads only the parts that changed).
; 0 = never look.
check=1

[extras]
; The Extras tray on the launcher's left edge: optional downloads that are not in the pack's
; zip (the nation music, ...). Click its front to slide it out, download or remove what you
; want. 0 = no tray.
tray=1

[fog]
; Smooth fog of war edges instead of the jagged tile grid.
smooth_fog=1
; Blur radius in fog cells (half a tile each), 0.3 to 1.5. Higher = rounder and softer.
fog_blur=1.0
; Gradual fade at the edge of your units' vision instead of a hard line.
soft_edge=1
; Width of that fade, 0.05 (sharp) to 1.0 (very soft).
fog_edge=1.0

[graphics]
; A clearer, richer picture: colour and sharpening added to the game's own final passes, so
; the map, units and buildings change but the interface does not. In the game, Ctrl+F9 turns
; it off and on, Ctrl+F10 shows the game's own picture on the left half of the screen and the
; new one on the right (to compare; press again to go back). 0 = the game's own picture.
postfx=1
; Sharpening, 0 (off) to 1 (strong). It runs in the game's anti-aliasing pass, so it needs
; Anti-Aliasing=1 in rise2.ini (the game's default).
sharpen=0.5
; More colour in the dull colours, leaving the already strong ones alone (0 = off, 0.3 = a lot).
vibrance=0.15
; Contrast: darker darks and brighter lights (0 = off, 0.3 = a lot).
contrast=0.12
; Warmer (above 0, more red) or cooler (below 0, more blue) colours, -0.1 to 0.1. 0 = off.
warmth=0
; Deeper blacks: this much of the darkest grey becomes black (0 = off, 0.05 = a lot).
black_level=0.02
; Corners and edges of the map slightly darker, to draw the eye to the middle (0 = off).
vignette=0.12
; The game's anti-aliasing smoothed nothing while bloom was off (it reads the brightness from
; a channel only the bloom pass fills). 1 = fixed, 0 = as in the game.
fix_fxaa=1
; 1 = the Ctrl+F9 / Ctrl+F10 keys above, 0 = no keys.
compare_keys=1
; Better water (seas, lakes, rivers): 1 = on, 0 = the game's own water. Ctrl+F9 / Ctrl+F10
; switch it together with the rest.
water=1
; Buildings, trees and units on the shore seen in the water, 0 (off) to 1 (a mirror). The game
; draws these reflections only with its high water quality.
water_reflections=0.5
; Sparkles of sunlight on the waves (0 = off, 3 = very bright).
water_glints=1.5
; The sky's light on the sides of the waves (0 = off, 1 = a lot).
water_sky=0.25
; Height of the small waves, 1 = the game's (0.5 calmer, 2 rougher).
water_waves=1.25

[grid]
; While you place a building: a tile grid over your own territory around the cursor.
; Green = that building can stand on the tile, red = blocked (trees, resources, buildings,
; water, cliffs, ...). Uses the game's own placement rule for the selected building.
build_grid=1
; How far around the cursor the grid reaches, in tiles (2 to 40).
grid_radius=16
; Opacity of the tiles, 10 (faint) to 255 (solid).
grid_alpha=90
; Width of the lines between tiles, as a fraction of a tile (0 = no lines, up to 0.3).
grid_line=0.08

[qol]
; Icon buttons above the bottom interface: military buildings, airbases and docks (once you
; have one) and the AI assistant panel. Hover them for help.
buttons=1
; 1 = the Airbase gets a strike button (the Attack icon): click it, then the target, and the
; aircraft inside attack it (or patrol the spot you click), as with a right-click.
airbase_strike=1
; 1 = with only Airbases selected, right-click and drag draws a circle on the ground; let go and
; one aircraft goes to each enemy target in it. Bombers take the buildings (the units only when
; the circle has no building), fighters the units (the buildings only when it has no unit).
; A plain right-click works as before; an empty circle sends every aircraft to patrol it.
airbase_area_strike=1
; Merchants that stay idle send themselves to trade, as if you right-clicked a route.
auto_trade=1
auto_trade_delay=5
; Command panel: a selection of different military buildings (e.g. Barracks + Stable)
; shows the units of all of them, one row per kind (infantry, cavalry and tanks,
; artillery, aircraft); locked buttons get a padlock and the ones you cannot afford right
; now are drawn darker. 0 turns off only these; the hotkeys, ranks and other marks on the
; buttons stay.
command_panel=1
; Hit points as numbers (current/max) under the health bar of the selected unit or building.
show_hp=1
; Units with craft points (Generals, Spies, patriots, ...): a blue bar of the craft points left
; right under their health bar. Needs ranks=1 (it is drawn with the rank bars).
mana_bar=1
; Several units selected: one picture per kind of unit with how many there are, instead of one
; picture per unit. 0 = the game's way (per unit, grouped only when they do not fit).
group_selection=1
; Skull stat in the selection panel: how many enemy units and buildings the selected
; military unit or building has destroyed (counted from the start of the session).
show_kills=1
; The Senator's Bribe works with the same key as the Spy's Bribe (the game gave the Senator none).
senator_bribe_hotkey=1
; The hotkey of each command button written in its top-left corner (no need to hover).
show_hotkeys=1
; Their font: size (the game has 12 and 14 bold, 18 plain; other sizes take the closest) and bold.
hotkey_font_size=14
hotkey_bold=1
; A selected Tower, Fort, City (any building that attacks) shows its attack range as a circle on the map.
range_circles=1
; Game setup: "Teams of 2 / 3 / 4" with Cooperative AI on no longer needs exactly 4 / 6 / 8
; players (the game said "Not enough players"); it needs what it asks without it: at least
; 3 / 5 / 7 and no team bigger than 2 / 3 / 4.
coop_ai_any_teams=1
; The unit or building under the cursor gets the selection mark (circle or rectangle) in
; white (yours), yellow (allies) or red (everyone else). With a squad, every soldier gets it.
hover_highlight=1
; A squad (several soldiers) shows a small health bar over every soldier, each with that
; soldier's own hit points, when it is selected or under the cursor (the game shows one bar
; over the captain only). The bar's width in percent of the game's bar.
squad_health_bars=1
squad_bar_width_percent=70
; The 3D model of the unit under the cursor (the whole squad) gets an outline in the same
; colours. Thickness in screen pixels; brightness above 1 makes it glow a little.
hover_outline=1
hover_outline_px=2
hover_outline_brightness=1.5
; The Senator bribes like the Spy: over an enemy unit it can bribe, the cursor is the bribe
; cursor and a right-click bribes it (the game gave the Senator only the Bribe button).
senator_bribe=1
; A selected building of yours shows a dotted line on the ground, in your colour, from the
; building to its rally flag.
rally_line=1
; Cost tooltips: after a price you cannot pay (the game writes it in red), how much you are
; short, for example "120 (-45)".
missing_resources=1
; A building of yours under the cursor (or selected) that trains or researches shows a thin
; cyan bar under its health bar with how far the job is.
production_bar=1
; ... and over the health bar, the icon of the unit or research it is working on (size in %).
production_icon=1
production_icon_size=100
; When a single-player game has loaded, the loading bar becomes a PLAY button and the game
; starts when you click it (or press Enter or Space), instead of starting by itself.
play_button=1
; Game setup screen: the nation's flag left of its name in the nation boxes and their lists.
nation_flags=1
; Game setup screen: the text of the Name, Nation and Difficulty boxes centred.
setup_centre=1
; Game setup screen: size of its text (boxes, labels, check boxes), percent of the game's.
; 125 goes with ui-theme's taller rows; the sizes come from ui-theme's fonts.xml.
setup_font_percent=125
; Game setup screen: the open nation list is a panel of flag cards (no names); hover a flag
; for the nation's tooltip. Random, Offensive... are buttons on the left. Needs the flags.
nation_grid=1
; Computer players named after their nation's leaders (Julius Caesar, Queen Chabi, ...)
; instead of "Computer".
ai_leader_names=1
; Single player: show every computer player's leader and nation from the start, on the
; loading screen and in the score list. 0 = the original rule: "Computer" until you meet them.
reveal_ai_players=1
; Position in pixels from the top-left corner of the bottom interface (y can be negative: above it).
; -1 = automatic: x at the left end; y just above the interface.
buttons_x=-1
buttons_y=-1
button_width=40
button_height=40

[units]
; Units turn smoothly: every model is drawn at its exact facing (the game has only 256 steps),
; and aircraft turn smoothly between game ticks instead of snapping. Drawing only.
smooth_facing=1

[gameplay]
; Gameplay rules. They change the game itself: in multiplayer every player needs the same values.
; 1 = no Armageddon defeat: when the Armageddon clock runs out the game goes on, but nobody can
; build or launch nuclear weapons any more. 0 = the game's rule (everyone loses).
no_armageddon=1
; 1 = a Nukes slider in the game setup, next to No Unique Units and the others: None (nobody can
; build Nuclear Missiles, ICBMs or Interceptors; Cruise Missiles stay), 1 to 250 nuclear weapons
; on the Armageddon clock, or Unlimited (no clock). Right-click = the game's rule. In
; multiplayer the host sets it for everyone. 0 = no slider, the game's rule.
no_nukes_option=1
; Attrition strength in percent of the game's: units in enemy territory without supply lose hit
; points this much more often (150 = a hit every 32 frames instead of 48). Supply Wagons, the
; supply techs and nation bonuses still reduce it as before. 100 = the game's attrition.
attrition_percent=150
; 1 = every Tower, Keep, Stockade or Bunker you own makes the next one of the line dearer (and the
; same for Forts, Castles, Fortresses and Redoubts). The game counted only the buildings of the
; exact type being priced, so towers could stay at the base price and computer players covered the
; map with them. 0 = the game's count.
defense_ramp_whole_line=1
; 1 = support for the Survival game mode (Script: Survival in the game setup): its clocks at the
; top right and the strip of the map where nobody may build, kept free for the waves.
survival_support=1
; 1 = a unit casting on a moving unit (the Senator's or the Spy's Bribe, ...) follows it: it
; casts as soon as the target is in range and changes its way when the target walks off,
; instead of walking to where the target was, stopping, and starting again. 0 = the game's.
cast_follow=1
; 1 = escorts and followers keep up with the unit they guard or follow (also the units around
; your artillery when an army with siege attacks): they change their way within about a second
; when it walks off, instead of walking to where it was (escorts every 4 s, followers when it was
; 12 tiles away). 0 = the game's.
escort_follow=1
; 1 = an idle fishing boat looks for another free fish after a few seconds (the game waits
; about a minute, with the idle alert ringing, when two boats pick the same fish).
fishing_retry=1
; Frames between two aircraft taking off from the same base (15 frames, about a second, in
; the game, so a strike arrived one plane at a time). 1 = they take off almost together.
air_launch_frames=1
; How long dead soldiers, tank and vehicle wrecks and the marks under them stay on the ground,
; in percent of the game's time (100 = about 9 seconds after the death animation, 667 = about a
; minute, 1000 at most). The death animation is not slowed. Tank wrecks also block the ground for
; that long. Past corpse_limit dead the oldest one goes at once.
corpse_time_percent=667
; How many dead the map keeps at once (the game: 100, enough for a small battle; 100 to 2000,
; about 164 bytes each). Past it the oldest dead vanish without fading.
corpse_limit=400
; Computer players keep Generals and Supply Wagons in proportion to their army (the AI kept
; training them instead of soldiers): one General per ai_army_per_general land army units
; (infantry, cavalry, tanks, guns; a squad counts once), one Supply Wagon per
; ai_army_per_supply_wagon, never more than the max. At least ai_support_seconds of game time
; between two new ones of a kind, so it cannot queue several at once.
; max -1 = the game's rule (no limit), 0 = none at all.
ai_army_per_general=20
ai_max_generals=3
ai_army_per_supply_wagon=15
ai_max_supply_wagons=4
ai_support_seconds=60
; 1 = veteran ranks: units gain experience from the damage they deal and rise through 9 levels
; (bronze, silver and gold bars beside the health bar of a selected or hovered unit). Each level
; gives more attack and hit points; level 3 +1 sight, 5 faster attack, 6 less damage taken,
; 7 +1 range, 8 faster attack again, 9 heals slowly out of combat. Kept in saved games.
; Defensive buildings (Cities, Towers, Forts, Lookouts, air defence, Red Fort, Forbidden City)
; rank up too. Spies and Generals rank up from their abilities (a successful Bribe counts as a kill). The
; selected unit's portrait shows its rank and an experience bar; its tooltip lists the bonuses.
ranks=1
; 1 = Generals get a fifth ability, Heal (1000 craft points, a full bar): for 5 seconds your
; units in the General's circle get back 25% of their hit points in total. Its button comes
; with the general-heal mod's data files.
general_heal=1
; 1 = idle units step aside for their own side's moving units: a unit whose way is blocked by an
; idle unit of yours (no orders) moves it, and its whole squad, a little to the side and waits
; for it, instead of walking around or getting stuck. Not moved: dug-in units, units in a Nest,
; decoys, other players' units, ships and aircraft.
make_way=1
; 1 = your land units walk through each other instead of bumping, waiting and walking around:
; through moving ones always, through standing ones until the last stretch of the way (then
; make_way moves them aside), so arriving units do not stop on top of the ones already there.
pass_through=1
; 1 = formations: a group of different units moves without one (each at its own speed, to a
; cluster around the target), and a formation is a compact block instead of two very long rows.
; Settings in [formations].
formations=1
; 1 = Large and Major Cities repair the damaged buildings of their own city by themselves, one
; at a time, the most damaged first, and pay for it as a Citizen does (a Large City as fast as one
; Citizen, a Major City as two). Wonders within the city's radius are repaired too. Small pliers
; with sparks float over the building being repaired. A switch on the city panel (the Repair
; button) turns it off and on for that city; on by default, also for computer players.
city_repair=1
; Seconds a building must go without being hit before a city repairs it.
city_repair_wait=45

[nuke]
; A nuclear blast turns the screen white and grey. 1 = only when you look at it: full when the
; blast is within flash_full_tiles of the screen centre, fading out to flash_far_percent at
; flash_zero_tiles and further (the distances grow when zoomed out). 0 = as in the game,
; every blast on the map flashes the whole screen.
flash_by_distance=1
flash_full_tiles=12
flash_zero_tiles=40
flash_far_percent=0
; Strength of the flash and the grey even when you look at it (100 = the game's).
flash_percent=100
; Over a nuke's target, while it flies, the radiation sign (seen by every player), shrinking
; towards the centre and turning slowly. Needs the nuke-fx mod's files in mod_override.
target_marker=1
; The scorched earth a blast leaves stays this many percent of the game's time (300 = 3 times,
; about 86 s instead of 29). Drawing only. The crater itself already stays the whole game.
scorch_percent=300
; The settings below change the game itself: in multiplayer every player needs the same values.
; Missile Silos can train Interceptors (needs the nuke-fx mod's data). Each silo holds up to 2 and
; fires one by itself at an enemy Nuclear Missile or ICBM within interceptor_reach_tiles of it,
; if the Interceptor can still meet it before it lands. A nuke shot down does no damage and does
; not count for Armageddon. The Interceptor leaves its silo at once and flies
; interceptor_speed_percent of the nuke's speed (400 = 4 times as fast).
interceptors=1
interceptor_reach_tiles=40
interceptor_speed_percent=400
; A silo fires only at nukes aimed at its owner: at one of your units or buildings, or at a
; point in your territory. 1 = also at nukes aimed at your allies.
interceptor_protect_allies=0
; Where an Interceptor meets its nuke: the size of the fireball in the air (the game's own
; explosion, 1 = a shell's) and a faint light over the screen, in percent of a nuke's flash
; (some of it even when it happens off the screen). Only your screen.
interception_burst_size=2
interception_flash_percent=8
; A blast that goes off leaves radiation over its whole radius for radiation_seconds: once a
; second every unit inside (any player, not aircraft, not buildings) loses this many percent of
; its max hit points, falling to 0 at the end (2 = 60% in total if it stays the whole time).
radiation=1
radiation_percent_per_second=2
radiation_seconds=60
; Computer players train Interceptors (up to 2 a silo) when an enemy has or can build nukes,
; from money they have not set aside, keeping this much Knowledge and Oil spare.
ai_interceptors=1
ai_knowledge_spare=500
ai_oil_spare=550

[heal]
; How much of their max hit points the units in the circle get back, over how many seconds.
percent=25
seconds=5
; Key for Heal with a General selected (one letter; empty = none). The game's hotkey settings
; do not list it. Without a General selected the key keeps its usual use.
hotkey=E

[make_way]
; Frames (15 a second) before a unit that was moved aside can be moved aside again.
cooldown_frames=45
; Tiles from the end of its way within which a moving unit no longer walks through your
; standing units (pass_through).
pass_clear=2
; 1 = allied land units are walked through the same way (enemies always block: units fight them).
pass_allies=1

[formations]
; 1 = a group with more than one unit type (Generals and Supply Wagons not counted) moves
; without a formation; a group of one unit type keeps its formation.
mixed_no_formation=1
; 1 = computer players' mixed groups too (0: they keep their formations).
computer_players=0
; 1 = Line and the other row formations stand as a compact block (100 Riflemen: about 7 rows of 15
; instead of 2 rows of 50). Up to 5 units still stand in one row.
compact=1
; How many times wider than deep the block is.
width_ratio=2

[ranks]
; Bonuses per level, in percent.
attack_percent_per_level=4
hits_percent_per_level=4
; Level 9 and 10: healing per second (percent of its hit points) after this many seconds out of combat.
heal_percent_per_second=1
heal_after_seconds=10
; Units without a weapon (Spy, General): experience per ability used, in percent of the unit's
; own cost for an ability of 1000 mana (Counterintelligence and Informer cost 500: half).
ability_xp_percent=35
; Experience gained, in percent (115 = 15 % faster than the base rate).
xp_gain_percent=115
; Defensive buildings: their experience is counted against at least this cost (a City's own
; base cost is only 20, a Tower's 80, a Fort's 400).
building_min_cost=150
; Promotion effect: the new insignia pops up over the unit, spins and fades (drawing only).
; 1 = every promotion you can see, 2 = only your own units, 0 = off.
promotion_effect=1
; Its size in percent.
promotion_effect_size=100
; The rank insignia beside the health bar of a selected or hovered unit or building: its size in
; percent (100 = 18 to 30 pixels tall, larger when zoomed in).
insignia_size=100

[assistant]
; What the computer may do when it plays your nation for you (console: computer <your name>;
; back with: human <your name>). Single player only. Changes apply while playing.
enabled=1
; citizens, scholars, caravans, merchants, fishermen; farms, camps, mines, Market, Library, ...
economy=1
; armies; Barracks, Stable, Siege Factory, Airbase, towers, forts, Missile Silo
military=1
; technologies (Library, ages, ...) and unit upgrades
research=1
; new cities
expansion=1
; wonders and the Data Center
wonders=0
; Resources it must leave you: it does not buy anything that would take a resource below this.
; reserve applies to all six; reserve_food, reserve_timber, reserve_wealth, reserve_knowledge,
; reserve_metal, reserve_oil override it for one resource.
reserve=0
; Units you give an order to stay yours: the computer does not pull them into its armies, does
; not move them about and does not send them off to build. They still fight back and work like
; a human player's units. Also with the game's Cooperative AI. 1 = on, 0 = off.
keep_ordered_units=1
; How long such a unit must stand idle before the computer may use it again, in seconds.
; -1 = never.
ordered_units_idle_seconds=60

[debug]
; Diagnostics for development, off for playing. zoom_trace: the first zooms of a session
; frame by frame in ron_zoom_trace.csv. viewport_log: the render targets and viewports the
; interface scaling sees (up to 300 lines in the log). The log itself starts new with every
; game; the previous one is kept as ron_camera.old.log.
zoom_trace=0
viewport_log=0
; crash_reports: when the game crashes, write a report to the crash folder and open the panel
; that can send it to the RON Revived Discord. crash_test=1 crashes the game on purpose when
; PLAY is pressed, to try the panel (set it back to 0 afterwards).
crash_reports=1
crash_test=0
