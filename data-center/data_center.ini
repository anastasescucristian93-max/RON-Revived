; City districts (data-center mod; they replaced the Data Center on 2026-10-29). This file turns
; them on in the mod's winmm.dll (keep it in the game folder). Every player in a multiplayer game
; needs the same values.

[expansions]
; Bonus of each district you own. Any number can be built; the bonuses add up and each one is
; lost when its district is destroyed.
; Housing District: population limit (goes past the game's maximum of 200).
population=10
; Commerce District: resource-rate limit of every resource (goes past the game's hard limit of 999).
commerce=30
; Industrial District: all resource income, in tenths of a percent (30 = +3%).
efficiency=30

[districts]
; Most empty tiles allowed between a new district and its city or another of its districts.
gap=2
; 1: districts unlock only once the game cannot go to a later Age (the setup's last Age, or the
; Information Age) and every Library technology up to it is researched (the four last ones
; excepted). 0: every Library technology up to the current Age is enough.
need_last_age=1
