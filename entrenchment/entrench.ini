; Entrenchment mod (Sandbag Nest). This file in the game folder turns the mod on in winmm.dll.
; Every player of a multiplayer game needs the same values.

[bonus]
; for a squad dug into a Sandbag Nest
range=1
fire_rate_percent=40
damage_dealt_percent=20

[nest]
; the fortification takes every hit meant for the soldiers in it until it is destroyed. Its hit
; points: this percent of the Tower line's for the owner's age (Tower 750, Keep 1000, Stockade 1300,
; Bunker 1700), plus the game's building bonuses
hits_percent_of_tower=50

[fee]
; paid when a squad digs in: percent of the squad's own price,
; + step for every squad the player already has dug in, the extra at most max_extra
percent_of_unit_cost=35
step_percent_per_squad=10
max_extra_percent=150

[rules]
; foot soldiers whose own maximum range is below this cannot dig in (melee 0, Scouts 3, Explorers 4);
; tanks, guns and other non-foot units never can
min_unit_range=5
; idle ranged foot soldiers this close to a fortification being built work on it (map units, 192 = 1 tile)
dig_reach=576

[look]
; how far the soldiers are sunk into the floor (model units; a soldier is about 16 tall)
sink=0
; one squad per fortification; its three soldiers stand on an equal triangle (one at the back, two
; at the front), this far from the centre (map units, 192 = 1 tile)
place_radius=100
; per age (1 Ancient .. 8 Information), for looks with high walls: the soldiers stand further in
; so the front walls do not hide them. Age 5 is the stone battery.
place_radius_age5=55
; a soldier this close to a Nest's centre is in it
inside_radius=170
; where the button that builds a fortification goes on a unit's panel (column 0-4, row 0-3)
dig_button_column=4
dig_button_row=1
; how far from the new fortification's centre the squads stand while they build it
dig_stand=384
